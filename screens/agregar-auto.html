<!DOCTYPE html>
<html class="dark" lang="es">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
  <link href="https://googleapis.com" rel="stylesheet">
  <link href="https://googleapis.com" rel="stylesheet">
  <script src="https://tailwindcss.com"></script>
  <style>
    body { background-color: #10131a; font-family: 'Space Grotesk', sans-serif; min-height: 100vh; margin: 0; padding: 0; }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="text-[#e1e2eb] flex flex-col justify-between min-h-screen bg-[#10131a]">

  <!-- ENCABEZADO SUPERIOR -->
  <header class="w-full bg-[#10131a]/85 backdrop-blur-xl border-b border-[#32353c] p-4 flex items-center justify-between z-50">
    <div class="flex items-center gap-3">
      <button onclick="history.back()" class="text-[#e1e2eb] flex items-center"><span class="material-symbols-outlined">arrow_back_ios</span></button>
      <div>
        <div class="flex items-center gap-2">
          <span class="font-bold text-lg">Tu Auto Inteligente</span>
          <span class="text-xs bg-[#1d2026] text-[#ffb955] px-1.5 py-0.5 rounded font-bold">CHILE · CLP</span>
        </div>
        <p class="text-xs text-[#ffb955] tracking-wider uppercase">Detalle Auto</p>
      </div>
    </div>
    <div class="w-8 h-8 rounded-full bg-[#ffb955] flex items-center justify-center text-[#452b00] font-bold">U</div>
  </header>

  <!-- FORMULARIO CENTRAL PRINCIPAL -->
  <main class="flex-1 max-w-md w-full mx-auto px-4 py-6 flex flex-col gap-5">
    
    <!-- APIS INDICADORES DE CONEXIÓN -->
    <div class="bg-[#1d2026] p-3 rounded-xl border border-[#32353c] flex flex-col gap-2">
      <div class="flex items-center justify-between text-xs font-bold uppercase tracking-wider">
        <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-[#3ceda4] animate-pulse"></span>Conexiones Oficiales en Vivo</span>
        <span class="text-[#3ceda4]">4 APIs OK</span>
      </div>
      <div class="grid grid-cols-2 gap-2 text-[10px]">
        <div class="bg-[#272a31] p-1.5 rounded border border-[#524534]/30 flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-[#3ceda4]"></span>CNE Bencina</div>
        <div class="bg-[#272a31] p-1.5 rounded border border-[#524534]/30 flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-[#3ceda4]"></span>SII Tasación</div>
        <div class="bg-[#272a31] p-1.5 rounded border border-[#524534]/30 flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-[#3ceda4]"></span>PRT Plantas</div>
        <div class="bg-[#272a31] p-1.5 rounded border border-[#524534]/30 flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-[#3ceda4]"></span>SOAP 2025</div>
      </div>
    </div>

    <!-- CAJA INTERACTIVA DEL FORMULARIO -->
    <div class="bg-[#1d2026] border border-[#32353c] rounded-2xl p-5 flex flex-col gap-4">
      <h2 class="font-bold text-lg flex items-center gap-2 text-[#e1e2eb]">
        <span class="material-symbols-outlined text-[#ffb955]">saved_search</span> Búsqueda Rápida de Vehículo
      </h2>

      <!-- Selector 1: Marca -->
      <div class="flex flex-col gap-1">
        <label class="text-xs text-[#ffb955] font-bold uppercase tracking-wider" for="brand">1. Marca del Vehículo</label>
        <select id="brand" onchange="actualizarModelosChilenos()" class="w-full h-11 px-3 rounded-xl bg-[#272a31] border border-[#524534] text-[#e1e2eb] focus:outline-none focus:border-[#ffb955]">
          <option value="">-- Elige la Marca --</option>
          <option value="dodge">Dodge</option>
          <option value="subaru">Subaru</option>
          <option value="toyota">Toyota</option>
          <option value="suzuki">Suzuki</option>
          <option value="hyundai">Hyundai</option>
        </select>
      </div>

      <!-- Selector 2: Modelo -->
      <div class="flex flex-col gap-1">
        <label class="text-xs text-[#ffb955] font-bold uppercase tracking-wider" for="model">2. Modelo</label>
        <select id="model" onchange="actualizarVersiones3CV()" class="w-full h-11 px-3 rounded-xl bg-[#272a31] border border-[#524534] text-[#e1e2eb] focus:outline-none focus:border-[#ffb955]" disabled>
          <option value="">-- Primero elige una marca --</option>
        </select>
      </div>

      <!-- Selector 3: Año -->
      <div class="flex flex-col gap-1">
        <label class="text-xs text-[#ffb955] font-bold uppercase tracking-wider" for="year">3. Año del Vehículo</label>
        <select id="year" class="w-full h-11 px-3 rounded-xl bg-[#272a31] border border-[#524534] text-[#e1e2eb] focus:outline-none focus:border-[#ffb955]">
          <option value="2011">2011</option>
          <option value="2012">2012</option>
          <option value="2015">2015</option>
          <option value="2020">2020</option>
          <option value="2024">2024</option>
        </select>
      </div>

      <!-- Selector 4: Versión 3CV -->
      <div class="flex flex-col gap-1">
        <label class="text-xs text-[#ffb955] font-bold uppercase tracking-wider" for="version_homologada">4. Versión Homologada Oficial (3CV)</label>
        <select id="version_homologada" class="w-full h-11 px-3 rounded-xl bg-[#272a31] border border-[#524534] text-[#e1e2eb] focus:outline-none focus:border-[#ffb955]" disabled>
          <option value="">-- Primero elige el modelo --</option>
        </select>
      </div>

      <!-- Botón de Sincronización -->
      <button class="w-full h-12 mt-2 rounded-xl bg-[#ffb955] text-[#452b00] font-bold hover:bg-[#ffddb4] transition-colors flex items-center justify-center gap-2 shadow-lg active:scale-95 transition-transform">
        <span class="material-symbols-outlined">sync</span> Sincronizar con SII, CNE y Supabase
      </button>
    </div>
  </main>

  <!-- BARRA DE NAVEGACIÓN INFERIOR CON ICONOS GRÁFICOS -->
  <footer class="w-full bg-[#10131a] border-t border-[#32353c] py-3 px-6 flex justify-between items-center text-xs text-[#d7c3ae] z-50">
    <button class="flex flex-col items-center gap-0.5 hover:text-[#ffb955]"><span class="material-symbols-outlined">leaderboard</span>Ranking</button>
    <button class="flex flex-col items-center gap-0.5 text-[#ffb955]"><span class="material-symbols-outlined">add_circle</span>+ Auto</button>
    <button class="flex flex-col items-center gap-0.5 hover:text-[#ffb955]"><span class="material-symbols-outlined">directions_car</span>Detalle</button>
    <button class="flex flex-col items-center gap-0.5 hover:text-[#ffb955]"><span class="material-symbols-outlined">payments</span>TCO</button>
    <button class="flex flex-col items-center gap-0.5 hover:text-[#ffb955]"><span class="material-symbols-outlined">apps</span>Todas (9)</button>
  </footer>

  <!-- SCRIPT DE CONTROL DE CASCADA AUTOMÁTICO -->
  <script>
    const catalogoModelos = {
      dodge: ["Nitro", "Ram", "Durango", "Journey"],
      subaru: ["Forester", "Outback", "XV", "Impreza"],
      toyota: ["RAV4", "Hilux", "Yaris", "Corolla"],
      suzuki: ["Swift", "Baleno", "Vitara", "Jimny"],
      hyundai: ["Accent", "Tucson", "Santa Fe", "Grand i10"]
    };

    const catalogoMotores3CV = {
      "nitro": [
        "3.7 V6 Gasolina Automática SXT (4x4)",
        "3.7 V6 Gasolina Automática SE (4x2)",
        "2.8 CRD Turbo Diesel Automática RT"
      ],
      "forester": [
        "2.0 AWD CVT Dynamic (Bencina)",
        "2.5 AWD CVT Limited (Bencina)",
        "2.0 e-Boxer Hybrid AWD"
      ],
      "rav4": [
        "2.0 LE 2WD CVT (Bencina)",
        "2.5 XLE AWD (Bencina)",
        "2.5 Hybrid Luxury CVT"
      ],
      "swift": [
        "1.2 Gasolina Manual GLS",
        "1.2 Gasolina Automática CVT GLX",
        "1.4 Turbo Boosterjet Sport"
      ]
    };

    function actualizarModelosChilenos() {
      const marca = document.getElementById("brand").value;
      const selectorModelo = document.getElementById("model");
      const selectorVersion = document.getElementById("version_homologada");
      
      selectorModelo.innerHTML = '<option value="">-- Selecciona un modelo --</option>';
      selectorVersion.innerHTML = '<option value="">-- Primero elige el modelo --</option>';
      selectorVersion.disabled = true;

      if (marca && catalogoModelos[marca]) {
        selectorModelo.disabled = false;
        catalogoModelos[marca].forEach(function(mod) {
          const opt = document.createElement("option");
          opt.value = mod.toLowerCase();
          opt.textContent = mod;
          selectorModelo.appendChild(opt);
        });
      } else {
        selectorModelo.disabled = true;
      }
    }

    function actualizarVersiones3CV() {
      const modelo = document.getElementById("model").value;
      const selectorVersion = document.getElementById("version_homologada");

      selectorVersion.innerHTML = '<option value="">-- Selecciona la versión real (3CV) --</option>';

      if (modelo && catalogoMotores3CV[modelo]) {
        selectorVersion.disabled = false;
        catalogoMotores3CV[modelo].forEach(function(version) {
          const opt = document.createElement("option");
          opt.value = version;
          opt.textContent = version;
          selectorVersion.appendChild(opt);
        });
      } else {
        selectorVersion.disabled = false;
        selectorVersion.innerHTML += `
          <option value="estandar_manual">Motor Estándar Gasolina Mecánico</option>
          <option value="estandar_auto">Motor Estándar Gasolina Automático / CVT</option>
          <option value="estandar_diesel">Variante Turbo Diésel (Mec/Aut)</option>
        `;
      }
    }
  </script>
</body>
</html>
